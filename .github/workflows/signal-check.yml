name: OMXS30 signal check

# Runs entirely on GitHub's servers — your Mac does not need to be on.
#
# Two schedules:
#   1. Once a day  -> always sends a status update (HOLD/BUY/SELL)
#   2. Every hour during weekday trading hours -> only pings you if a
#      genuine BUY/SELL signal appears (no spam on HOLD)
#
# One-time setup:
#   Settings -> Secrets and variables -> Actions -> New repository secret
#     TG_BOT_TOKEN = your bot token from BotFather
#     TG_CHAT_ID   = your Telegram chat id
#
# You can also trigger it manually any time from the "Actions" tab
# using the "Run workflow" button (workflow_dispatch, below).

on:
  schedule:
    - cron: "5 6 * * 1-5"          # 06:05 UTC, Mon-Fri — daily summary
    - cron: "0 7-16 * * 1-5"       # every hour, 07:00-16:00 UTC, Mon-Fri — signal check
  workflow_dispatch: {}             # lets you click "Run workflow" manually on GitHub

jobs:
  check-signal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install yfinance pandas numpy matplotlib requests

      - name: Daily summary (06:05 UTC run)
        if: github.event.schedule == '5 6 * * 1-5'
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python3 signal_bot.py --market omxs30 --interval 1d --notify --daily --no-plot

      - name: Hourly signal check (all other runs)
        if: github.event.schedule != '5 6 * * 1-5'
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python3 signal_bot.py --market omxs30 --interval 1d --notify --no-plot

      - name: Manual run (workflow_dispatch) — always sends a summary
        if: github.event_name == 'workflow_dispatch'
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python3 signal_bot.py --market omxs30 --interval 1d --notify --daily --no-plot
